<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATOS DE ESGOTO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Special+Elite&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            background-color: #0a0f0a;
            color: #b8b8a8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 2rem 1rem;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30"><text font-family="Arial" font-size="20" y="20">⚔️</text></svg>') 12 0, auto;
            position: relative;
        }

        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: rgba(20, 25, 15, 0.5);
            border-radius: 0;
        }

        body::-webkit-scrollbar-thumb {
            background: rgba(80, 120, 80, 0.15);
            border-radius: 0;
            border: 1px dotted rgba(80, 120, 80, 0.2);
        }

        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #0a1a0a, #030803 95%);
            z-index: 0;
        }

        #star-rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.25;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .image-container {
            position: relative;
            border-radius: 20px 6px 20px 6px;
            overflow: hidden;
            border: 1px solid rgba(80, 120, 70, 0.08);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
            transform: rotate(0.2deg) scale(0.99);
            transition: all 0.3s;
            clip-path: polygon(
                0% 0%,
                100% 0%,
                100% 85%,
                98% 88%,
                95% 85%,
                92% 90%,
                88% 86%,
                84% 92%,
                80% 87%,
                76% 93%,
                72% 88%,
                68% 94%,
                64% 89%,
                60% 95%,
                56% 90%,
                52% 96%,
                48% 91%,
                44% 97%,
                40% 92%,
                36% 98%,
                32% 93%,
                28% 99%,
                24% 94%,
                20% 100%,
                16% 95%,
                12% 101%,
                8% 96%,
                4% 102%,
                0% 97%
            );
        }

        .image-container:hover {
            transform: rotate(0deg) scale(1);
            border-color: rgba(100, 160, 90, 0.1);
            box-shadow: 0 0 60px rgba(20, 80, 20, 0.03);
        }

                .image-container {
            
            background: transparent; 
        }

        .image-container img {
            width: 115%; 
            height: auto;
            max-height: 500px;
            object-fit: cover; 
            display: block;
            background: transparent;
            margin-left: -7.5%; 
            filter: saturate(0.8) contrast(0.9) brightness(0.9);
            transition: all 0.3s;
        }

        .content-box {
            position: relative;
            background: rgba(12, 18, 12, 0.88);
            backdrop-filter: blur(2px);
            padding: 2rem 1.8rem;
            border-radius: 30px 8px 30px 8px;
            box-shadow: 
                0 0 60px rgba(0, 0, 0, 0.6),
                inset 0 0 50px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(40, 80, 40, 0.02);
            animation: borderPulse 10s infinite alternate;
            transform: rotate(0.4deg) skew(-0.3deg);
            border: 2px solid transparent;
            border-image: repeating-linear-gradient(
                45deg,
                rgba(80, 120, 70, 0.08) 0px,
                rgba(80, 120, 70, 0.08) 10px,
                transparent 10px,
                transparent 20px,
                rgba(80, 120, 70, 0.04) 20px,
                rgba(80, 120, 70, 0.04) 30px,
                transparent 30px,
                transparent 40px
            ) 30;
            clip-path: polygon(
                0% 0%,
                100% 0%,
                100% 100%,
                98% 97%,
                95% 100%,
                92% 96%,
                88% 101%,
                84% 97%,
                80% 102%,
                76% 98%,
                72% 103%,
                68% 99%,
                64% 104%,
                60% 100%,
                56% 105%,
                52% 101%,
                48% 106%,
                44% 102%,
                40% 107%,
                36% 103%,
                32% 108%,
                28% 104%,
                24% 109%,
                20% 105%,
                16% 110%,
                12% 106%,
                8% 111%,
                4% 107%,
                0% 108%
            );
        }

        .content-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 32px 10px 32px 10px;
            background: repeating-linear-gradient(
                45deg, 
                transparent, 
                transparent 20px,
                rgba(80, 120, 70, 0.01) 20px,
                rgba(80, 120, 70, 0.01) 21px
            );
            pointer-events: none;
            z-index: -1;
        }

        .content-box .graffiti {
            position: absolute;
            font-family: 'Caveat', cursive;
            color: rgba(80, 120, 70, 0.04);
            font-size: 3rem;
            pointer-events: none;
            transform: rotate(-15deg);
            z-index: 0;
        }

        .content-box .graffiti.g1 {
            top: 10%;
            left: 5%;
            font-size: 2.5rem;
            transform: rotate(-20deg);
        }

        .content-box .graffiti.g2 {
            bottom: 15%;
            right: 5%;
            font-size: 3.5rem;
            transform: rotate(25deg);
        }

        .content-box .graffiti.g3 {
            top: 40%;
            right: 8%;
            font-size: 2rem;
            transform: rotate(10deg);
        }

        .content-box .graffiti.g4 {
            bottom: 30%;
            left: 3%;
            font-size: 2.8rem;
            transform: rotate(-30deg);
        }

        @keyframes borderPulse {
            0% { box-shadow: 0 0 40px rgba(0, 0, 0, 0.3); }
            100% { box-shadow: 0 0 80px rgba(20, 80, 20, 0.02); }
        }

        h1 {
            position: relative;
            z-index: 1;
            font-size: 2.4rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #8aaa7a, #4a6a3a, #8aaa7a);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 9s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(60, 140, 60, 0.02);
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            min-height: 4rem;
            transform: skew(-0.5deg) rotate(-0.3deg);
            word-break: break-word;
        }

        @keyframes shineText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .custom-widget {
            position: relative;
            z-index: 1;
            background: rgba(10, 16, 10, 0.5);
            border: 1px dotted rgba(70, 120, 70, 0.06);
            border-radius: 18px 4px 18px 4px;
            padding: 1.2rem 1.5rem;
            margin: 0 0 1.2rem 0;
            text-align: left;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
            transition: all 0.3s;
            transform: rotate(-0.1deg);
            backdrop-filter: blur(2px);
        }

        .custom-widget:hover {
            border-color: rgba(100, 160, 90, 0.1);
            box-shadow: 0 0 40px rgba(20, 80, 20, 0.02);
            transform: rotate(0.1deg) scale(1.003);
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dotted rgba(70, 120, 70, 0.06);
            padding-bottom: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .widget-header .server-name {
            color: #6a8a5a;
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-weight: 700;
            font-family: 'Special Elite', monospace;
            text-transform: uppercase;
        }

        .widget-header .online-count {
            color: #4a7a4a;
            font-size: 0.7rem;
            letter-spacing: 1px;
            background: rgba(40, 80, 40, 0.08);
            padding: 4px 14px;
            border-radius: 20px 4px 20px 4px;
            border: 1px dotted rgba(60, 120, 60, 0.06);
            font-family: 'Special Elite', monospace;
        }

        .widget-channels {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.8rem;
            margin-bottom: 0.8rem;
        }

        .widget-channels span {
            color: #5a7a4a;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            background: rgba(20, 40, 20, 0.1);
            padding: 3px 10px;
            border-radius: 10px 2px 10px 2px;
            border: 1px dotted rgba(60, 120, 60, 0.02);
            font-family: 'Special Elite', monospace;
        }

        .widget-channels span:before {
            content: "# ";
            color: #3a6a3a;
        }

        .widget-members {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.8rem;
            margin-top: 0.5rem;
            padding-top: 0.6rem;
            border-top: 1px dotted rgba(60, 120, 60, 0.04);
        }

        .widget-members span {
            color: #6a8a5a;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            background: rgba(20, 40, 20, 0.05);
            padding: 2px 10px;
            border-radius: 8px 2px 8px 2px;
            font-family: 'Special Elite', monospace;
        }

        .widget-members .member-online:before {
            content: "● ";
            color: #4a8a4a;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .widget-members .member-idle:before {
            content: "● ";
            color: #a88a30;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .widget-members .member-offline:before {
            content: "○ ";
            color: #3a4a3a;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .server-name {
            position: relative;
            z-index: 1;
            font-size: 1rem;
            color: #5a7a4a;
            letter-spacing: 3px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(40, 80, 40, 0.02);
            font-family: 'Special Elite', monospace;
            transform: skew(-0.3deg) rotate(-0.2deg);
        }

        .server-name span {
            color: #4a7a3a;
            text-shadow: 0 0 20px rgba(40, 100, 40, 0.03);
        }

        .btn-duel {
            position: relative;
            z-index: 1;
            display: inline-block;
            background: transparent;
            border: 1px dotted rgba(70, 130, 70, 0.06);
            color: #6a8a5a;
            padding: 14px 34px;
            font-size: 1rem;
            font-family: 'Special Elite', monospace;
            font-weight: 700;
            border-radius: 30px 6px 30px 6px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            margin-top: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            animation: pulseGlow 4s ease-in-out infinite;
            transform: rotate(-0.2deg) skew(-0.3deg);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(60, 140, 60, 0.01); }
            50% { box-shadow: 0 0 30px rgba(80, 180, 80, 0.02), 0 0 60px rgba(60, 140, 60, 0.01); }
            100% { box-shadow: 0 0 10px rgba(60, 140, 60, 0.01); }
        }

        .btn-duel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(60, 140, 60, 0.01), transparent, rgba(80, 180, 80, 0.01), transparent);
            animation: rotateBorder 15s linear infinite;
            opacity: 0.2;
        }

        @keyframes rotateBorder {
            100% { transform: rotate(360deg); }
        }

        .btn-duel:hover {
            background: rgba(60, 140, 60, 0.02);
            color: #7a9a6a;
            border-color: rgba(80, 180, 80, 0.08);
            box-shadow: 0 0 40px rgba(60, 140, 60, 0.01);
            transform: scale(1.02) rotate(0.2deg) skew(0.3deg);
            animation-play-state: paused;
        }

        .btn-duel span {
            position: relative;
            z-index: 2;
        }

        .social-links {
            position: relative;
            z-index: 1;
            margin-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .social-link {
            color: #3a5a3a;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Special Elite', monospace;
            transition: all 0.3s;
            border: 1px dotted rgba(60, 120, 60, 0.02);
            padding: 6px 14px;
            border-radius: 14px 3px 14px 3px;
            transform: rotate(-0.1deg);
        }

        .social-link:hover {
            color: #6a8a5a;
            border-color: rgba(80, 160, 80, 0.04);
            box-shadow: 0 0 20px rgba(40, 80, 40, 0.01);
            transform: scale(1.03) rotate(0.1deg);
        }

        .footer {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dotted rgba(60, 120, 60, 0.04);
            font-size: 0.7rem;
            color: #2a4a2a;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.8;
            min-height: 3rem;
            font-family: 'Special Elite', monospace;
        }

        .footer .highlight {
            color: #3a5a3a;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; min-height: 3rem; }
            .image-container img { max-height: 300px; }
            .content-box { padding: 1.5rem 1rem; }
            .custom-widget { padding: 0.8rem 1rem; }
            .widget-header .server-name { font-size: 0.75rem; }
            .widget-header .online-count { font-size: 0.55rem; }
            .server-name { font-size: 0.8rem; }
            .btn-duel { padding: 10px 18px; font-size: 0.8rem; }
            .social-link { font-size: 0.5rem; padding: 4px 10px; }
            .footer { font-size: 0.5rem; }
            .content-box .graffiti { display: none; }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    <canvas id="star-rain-canvas"></canvas>
    <canvas id="particles-canvas"></canvas>

    <div class="content">

        <div class="image-container">
            <img id="imagemRato" src="99c4d49d18d6b1f808a35aa98c4cf8b7.jpg" alt="rato de esgoto">
        </div>

        <div class="content-box">

            <span class="graffiti g1">✦</span>
            <span class="graffiti g2">✧</span>
            <span class="graffiti g3">✦</span>
            <span class="graffiti g4">✧</span>

            <h1 id="titulo"></h1>

            <div class="custom-widget">
                <div class="widget-header">

                </div>

                    <span>bate-papo 1</span>

                </div>

                <span>INVOCAR DISCORD</span>
            </a>

                <a href="https://www.youtube.com/channel/UCWD36eAq83hQOn5WQZSnrag" target="_blank" class="social-link">YOUTUBE</a>
            </div>

                <span class="highlight" id="rodape"></span>
            </div>

    </div>

    <script>
        const titulo = document.getElementById('titulo');
        const texto = 'RATOS DE ESGOTO';
        let index = 0;

        function digitarTitulo() {
            if (index < texto.length) {
                const delay = Math.floor(Math.random() * 80) + 40;
                titulo.textContent += texto.charAt(index);
                index++;
                setTimeout(digitarTitulo, delay);
            }
        }
        digitarTitulo();

        const rodape = document.getElementById('rodape');
        const textoRodape = 'Jerry roubou meu queijo...';
        let indexRodape = 0;

        function digitarRodape() {
            if (indexRodape < textoRodape.length) {
                const delay = Math.floor(Math.random() * 60) + 30;
                rodape.textContent += textoRodape.charAt(indexRodape);
                indexRodape++;
                setTimeout(digitarRodape, delay);
            }
        }

        const canvasRain = document.getElementById('star-rain-canvas');
        const ctxRain = canvasRain.getContext('2d');
        let rainWidth, rainHeight;
        let drops = [];

        function resizeRain() {
            rainWidth = canvasRain.width = window.innerWidth;
            rainHeight = canvasRain.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeRain);
        resizeRain();

        const stars = ['✦', '✧', '⋆', '✶', '✴'];

        class StarDrop {
            constructor() {
                this.x = Math.random() * rainWidth;
                this.y = Math.random() * rainHeight - rainHeight;
                this.char = stars[Math.floor(Math.random() * stars.length)];
                this.size = Math.floor(Math.random() * 18) + 10;
                this.speed = Math.random() * 2.5 + 1;
                this.opacity = Math.random() * 0.3 + 0.05;
                this.wobble = Math.random() * 0.4 + 0.05;
                this.wobbleOffset = Math.random() * 100;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y / 50 + this.wobbleOffset) * this.wobble;
                if (this.y > rainHeight) {
                    this.y = -this.size;
                    this.x = Math.random() * rainWidth;
                    this.char = stars[Math.floor(Math.random() * stars.length)];
                    this.speed = Math.random() * 2.5 + 1;
                    this.opacity = Math.random() * 0.3 + 0.05;
                    this.wobble = Math.random() * 0.4 + 0.05;
                    this.wobbleOffset = Math.random() * 100;
                }
            }

            draw() {
                ctxRain.fillStyle = `rgba(180, 220, 180, ${this.opacity})`;
                ctxRain.font = `${this.size}px "Courier New", monospace`;
                ctxRain.fillText(this.char, this.x, this.y);
            }
        }

        function initRain(count = 140) {
            drops = [];
            for (let i = 0; i < count; i++) {
                drops.push(new StarDrop());
            }
        }
        initRain(160);

        function animateRain() {
            ctxRain.clearRect(0, 0, rainWidth, rainHeight);
            drops.forEach(d => {
                d.update();
                d.draw();
            });
            requestAnimationFrame(animateRain);
        }
        animateRain();

        const canvasParticles = document.getElementById('particles-canvas');
        const ctxParticles = canvasParticles.getContext('2d');
        let pWidth, pHeight;
        let particles = [];

        function resizeParticles() {
            pWidth = canvasParticles.width = window.innerWidth;
            pHeight = canvasParticles.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeParticles);
        resizeParticles();

        const colors = ['#142214', '#1a2a1a', '#0a1a0a', '#223222', '#162a16', '#1e2e1e', '#0e1e0e', '#2a3a2a'];

        class Particle {
            constructor() {
                this.x = Math.random() * pWidth;
                this.y = Math.random() * pHeight;
                this.size = Math.floor(Math.random() * 5) + 2;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.25;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.25 + 0.03;
                this.trail = [];
                this.maxTrail = 5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > pWidth || this.x < 0) this.speedX *= -1;
                if (this.y > pHeight || this.y < 0) this.speedY *= -1;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) this.trail.shift();
            }

            draw() {
                for (let i = 0; i < this.trail.length; i++) {
                    const pos = this.trail[i];
                    const opacity = (i / this.trail.length) * this.opacity * 0.15;
                    ctxParticles.fillStyle = this.color;
                    ctxParticles.globalAlpha = opacity;
                    ctxParticles.fillRect(pos.x - this.size / 2, pos.y - this.size / 2, this.size, this.size);
                }
                ctxParticles.globalAlpha = this.opacity;
                ctxParticles.fillStyle = this.color;
                ctxParticles.shadowColor = this.color;
                ctxParticles.shadowBlur = 3;
                ctxParticles.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                ctxParticles.shadowBlur = 0;
                ctxParticles.globalAlpha = 1;
            }
        }

        function initParticles(count = 240) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles(260);

        function animateParticles() {
            ctxParticles.clearRect(0, 0, pWidth, pHeight);
            ctxParticles.fillStyle = 'rgba(6, 12, 6, 0.08)';
            ctxParticles.fillRect(0, 0, pWidth, pHeight);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        const btn = document.getElementById('btnDuel');
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const discordLink = this.href;
            this.style.transform = 'scale(0.95) rotate(0.5deg) skew(0.5deg)';
            setTimeout(() => this.style.transform = 'scale(1) rotate(-0.2deg) skew(-0.3deg)', 150);
            setTimeout(() => {
                window.location.href = discordLink;
            }, 250);
        });

        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-duel')) return;
            for (let i = 0; i < 15; i++) {
                const p = new Particle();
                p.x = e.clientX + (Math.random() - 0.5) * 100;
                p.y = e.clientY + (Math.random() - 0.5) * 100;
                p.size = Math.floor(Math.random() * 8) + 2;
                p.speedX = (Math.random() - 0.5) * 1.8;
                p.speedY = (Math.random() - 0.5) * 1.8;
                p.color = colors[Math.floor(Math.random() * colors.length)];
                p.opacity = Math.random() * 0.4 + 0.05;
                particles.push(p);
                setTimeout(() => {
                    const index = particles.indexOf(p);
                    if (index > -1) particles.splice(index, 1);
                }, 2000);
            }
        });

        setTimeout(digitarRodape, 1600);
    </script>

</body>
</html>
