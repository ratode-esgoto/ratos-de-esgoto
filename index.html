<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATOS DE ESGOTO</title>
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RATOS DE ESGOTO" />
    <meta property="og:description" content="O QG subterrâneo dos ratos. Entra lá." />
    <meta property="og:image" content="https://ratode-esgoto.github.io/ratos-de-esgoto/99c4d49d18d6b1f808a35aa98c4cf8b7.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RATOS DE ESGOTO" />
    <meta name="twitter:description" content="O QG subterrâneo dos ratos. Entra lá." />
    <meta name="twitter:image" content="https://ratode-esgoto.github.io/ratos-de-esgoto/99c4d49d18d6b1f808a35aa98c4cf8b7.jpg?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(40, 50, 30, 0.4), transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(60, 30, 20, 0.2), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(10, 20, 10, 0.8), transparent 80%);
            color: #a39e8f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 2rem 1rem;
            position: relative;
            cursor: crosshair;
        }

        #flashlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), transparent 0%, rgba(0, 0, 0, 0.95) 30%);
            pointer-events: none;
            z-index: 9998;
            transition: background 0.1s;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse at center bottom, rgba(40, 80, 40, 0.2), transparent 70%);
            animation: sewerLight 5s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes sewerLight {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }

        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9997;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(255,255,255,0.03) 0%, transparent 25%),
                radial-gradient(circle at 100% 0%, rgba(255,255,255,0.03) 0%, transparent 25%),
                radial-gradient(circle at 0% 100%, rgba(255,255,255,0.03) 0%, transparent 25%),
                radial-gradient(circle at 100% 100%, rgba(255,255,255,0.03) 0%, transparent 25%);
            filter: blur(1px);
        }

        .crack-overlay::before,
        .crack-overlay::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            opacity: 0.3;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
        }

        .crack-overlay::before {
            top: -50px;
            left: -50px;
            background: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(90, 80, 70, 0.1) 15px, rgba(90, 80, 70, 0.1) 16px);
        }

        .crack-overlay::after {
            bottom: -50px;
            right: -50px;
            background: repeating-linear-gradient(-45deg, transparent, transparent 15px, rgba(90, 80, 70, 0.1) 15px, rgba(90, 80, 70, 0.1) 16px);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.3;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 700px;
            width: 100%;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .underground-clock {
            position: relative;
            z-index: 11;
            font-family: 'Special Elite', monospace;
            font-size: 1.1rem;
            color: #6a9a5a;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(40, 140, 40, 0.5);
            border: 1px dashed rgba(70, 90, 50, 0.2);
            padding: 8px 20px;
            background: rgba(5, 8, 5, 0.7);
            border-radius: 3px 12px 3px 12px;
            transform: rotate(-1deg);
        }

        .underground-clock span {
            color: #a0c0a0;
        }

        .image-container {
            position: relative;
            border-radius: 4px 15px 4px 15px;
            overflow: hidden;
            border: 2px dashed rgba(100, 90, 70, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transform: rotate(-0.5deg);
            transition: all 0.3s;
            background: #14110b;
            clip-path: polygon(
                0% 0%, 100% 0%, 100% 90%, 
                97% 93%, 94% 90%, 91% 96%, 88% 92%, 85% 97%, 
                82% 93%, 79% 98%, 76% 94%, 73% 99%, 70% 95%, 
                67% 100%, 64% 96%, 61% 98%, 58% 93%, 55% 97%, 
                52% 94%, 49% 99%, 46% 95%, 43% 98%, 40% 94%, 
                37% 97%, 34% 93%, 31% 98%, 28% 94%, 25% 99%, 
                22% 95%, 19% 100%, 16% 96%, 13% 98%, 10% 94%, 
                7% 97%, 4% 95%, 2% 99%, 0% 96%
            );
        }

        .image-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(40, 30, 20, 0.3) 45%, transparent 50%);
            animation: drip 4s infinite linear;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes drip {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .image-container:hover {
            transform: rotate(0deg) scale(1.08);
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            display: block;
            filter: sepia(0.4) saturate(0.8) contrast(1.1) brightness(0.8);
            transition: all 0.3s;
        }

        .image-container:hover img {
            filter: sepia(0) saturate(1) contrast(1) brightness(1);
        }

        .content-box {
            position: relative;
            background: rgba(15, 15, 12, 0.9);
            backdrop-filter: blur(4px);
            padding: 2rem 1.5rem;
            border-radius: 6px 20px 6px 20px;
            border: 1px solid rgba(80, 70, 50, 0.2);
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.8);
            transform: rotate(0.3deg);
            transition: all 0.3s;
        }

        .content-box:hover {
            transform: rotate(0deg);
        }

        h1 {
            position: relative;
            z-index: 1;
            font-size: 2.2rem;
            font-weight: 700;
            font-family: 'Special Elite', monospace;
            color: #b0a889;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(150, 140, 100, 0.1);
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
            min-height: 4rem;
            word-break: break-word;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; }
            20%, 22% { opacity: 0.5; }
        }

        .custom-widget {
            position: relative;
            z-index: 1;
            background: rgba(5, 8, 5, 0.6);
            border: 1px dashed rgba(80, 70, 50, 0.3);
            padding: 1.2rem;
            margin: 0 0 1.2rem 0;
            text-align: left;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            transform: rotate(-0.5deg);
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dotted rgba(80, 70, 50, 0.2);
            padding-bottom: 0.5rem;
            margin-bottom: 0.8rem;
        }

        .widget-header .server-name {
            color: #b0a889;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .widget-header .online-count {
            color: #7a9a5a;
            font-size: 0.65rem;
            background: rgba(20, 30, 20, 0.5);
            padding: 3px 10px;
            border: 1px solid rgba(70, 90, 50, 0.2);
        }

        .widget-channels, .widget-members {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
            margin-bottom: 0.8rem;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            color: #8a9a7a;
        }

        .widget-channels span, .widget-members span {
            background: rgba(10, 15, 10, 0.5);
            padding: 2px 8px;
            border-radius: 2px;
        }

        .widget-channels span:before {
            content: "# ";
            color: #5a6a4a;
        }

        .widget-members .member-online:before {
            content: "● ";
            color: #6a9a5a;
            font-size: 0.8rem;
        }

        .widget-members .member-idle:before {
            content: "● ";
            color: #b0a060;
            font-size: 0.8rem;
        }

        .widget-members .member-offline:before {
            content: "○ ";
            color: #4a4a4a;
            font-size: 0.8rem;
        }

        .server-name {
            color: #8a7a5a;
            font-size: 0.95rem;
            letter-spacing: 3px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            font-family: 'Special Elite', monospace;
            transform: skew(-1deg);
        }

        .server-name span {
            color: #b0a889;
        }

        .btn-duel {
            display: inline-block;
            background: linear-gradient(135deg, #2a2a22, #1a1a14);
            border: 2px solid rgba(90, 80, 60, 0.4);
            color: #b0a889;
            padding: 14px 30px;
            font-size: 1rem;
            font-family: 'Special Elite', monospace;
            font-weight: 700;
            border-radius: 3px 12px 3px 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transform: rotate(-1deg);
        }

        .btn-duel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05), transparent 50%);
            animation: rotateBorder 8s linear infinite;
        }

        @keyframes rotateBorder {
            100% { transform: rotate(360deg); }
        }

        .btn-duel:hover {
            background: #3a3a2a;
            color: #d0c8a0;
            transform: scale(1.02) rotate(0.5deg);
            box-shadow: 0 0 20px rgba(180, 160, 100, 0.2);
        }

        .btn-duel span {
            position: relative;
            z-index: 2;
        }

        .social-links {
            margin-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .social-link {
            color: #6a5a4a;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Special Elite', monospace;
            border-bottom: 1px dotted rgba(90, 80, 60, 0.4);
            padding-bottom: 2px;
            transition: 0.3s;
        }

        .social-link:hover {
            color: #b0a889;
            border-color: #b0a889;
        }

        .footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed rgba(80, 70, 50, 0.2);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #6a5a4a;
            transform: rotate(-1deg);
            animation: flickerFooter 3s infinite;
        }

        @keyframes flickerFooter {
            0%, 50%, 100% { opacity: 1; }
            10%, 12% { opacity: 0.2; }
            53% { opacity: 0.4; }
            55% { opacity: 0.8; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .image-container img { max-height: 350px; }
            .content-box { padding: 1.5rem 1rem; }
            .underground-clock { font-size: 0.8rem; padding: 6px 12px; }
            #flashlight {
                background: none;
                z-index: -1;
            }
        }
    </style>
</head>
<body>

    <div id="flashlight"></div>

    <div class="crack-overlay"></div>

    <canvas id="particles-canvas"></canvas>

    <div class="content">

        <div class="underground-clock" id="undergroundClock">
            <span>HORA DO ESGOTO: </span><span id="clockTime">00:00:00</span>
        </div>

        <div class="image-container">
            <img src="99c4d49d18d6b1f808a35aa98c4cf8b7.jpg" alt="Rato de esgoto">
        </div>

        <div class="content-box">

            <h1 id="titulo"></h1>

            <div class="custom-widget">
                <div class="widget-header">
                    <span class="server-name">QG SUBTERRÂNEO</span>
                    <span class="online-count">300 RATOS ONLINE</span>
                </div>
                <div class="widget-channels">
                    <span>bate-papo</span>
                    <span>lama</span>
                    <span>toca</span>
                    <span>musica</span>
                </div>
                <div class="widget-members">
                    <span class="member-online">Carl-bot</span>
                    <span class="member-online">Rato ninja</span>
                    <span class="member-online">Rato mago</span>
                    <span class="member-idle">Rato anônimo</span>
                    <span class="member-offline">Rato lutador</span>
                </div>
            </div>

            <div class="server-name">
                <span>Entrar no esgoto?</span>
            </div>

            <a href="https://discord.gg/sHaECvHMXP" target="_self" class="btn-duel" id="btnDuel">
                <span>INVOCAR RATOS</span>
            </a>

            <div class="social-links">
                <a href="https://www.youtube.com/channel/UCWD36eAq83hQOn5WQZSnrag" target="_blank" class="social-link">YOUTUBE</a>
            </div>

            <div class="footer">
                Jerry roubou meu queijo...
            </div>

        </div>

    </div>

    <script>
        const titulo = document.getElementById('titulo');
        const texto = 'RATOS DE ESGOTO';
        let index = 0;

        function digitarTitulo() {
            if (index < texto.length) {
                const delay = Math.floor(Math.random() * 100) + 50;
                titulo.textContent += texto.charAt(index);
                index++;
                setTimeout(digitarTitulo, delay);
            }
        }
        digitarTitulo();

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const cores = ['#1a2a1a', '#2a3a2a', '#4a3a2a', '#5a4a3a'];

        class Particula {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.floor(Math.random() * 4) + 1;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.1;
                this.cor = cores[Math.floor(Math.random() * cores.length)];
                this.opacidade = Math.random() * 0.3 + 0.05;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.fillStyle = this.cor;
                ctx.globalAlpha = this.opacidade;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particula());
            }
        }
        init();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        const btn = document.getElementById('btnDuel');
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const discordLink = this.href;
            this.style.transform = 'scale(0.95)';
            setTimeout(() => this.style.transform = 'rotate(0deg) scale(1)', 150);
            setTimeout(() => {
                window.location.href = discordLink;
            }, 250);
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const flashlight = document.getElementById('flashlight');
        document.addEventListener('mousemove', function(e) {
            const x = e.clientX;
            const y = e.clientY;
            flashlight.style.setProperty('--mouse-x', `${x}px`);
            flashlight.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>

</body>
</html>
