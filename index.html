<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATOS DE ESGOTO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0a120a;
            color: #d0e0d0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 2rem 1rem;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30"><text font-family="Arial" font-size="20" y="20">⚔️</text></svg>') 12 0, auto;
        }

        body::-webkit-scrollbar {
            width: 4px;
        }

        body::-webkit-scrollbar-track {
            background: rgba(10, 20, 10, 0.3);
        }

        body::-webkit-scrollbar-thumb {
            background: rgba(80, 200, 80, 0.3);
            border-radius: 10px;
        }

        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #0a1a0a, #050a05 85%);
            z-index: 0;
        }

        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 850px;
            width: 100%;
            background: rgba(8, 18, 8, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(60, 180, 60, 0.15);
            border-radius: 32px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.4);
            animation: borderPulse 6s infinite alternate;
            margin: auto 0;
        }

        @keyframes borderPulse {
            0% { border-color: rgba(60, 180, 60, 0.1); box-shadow: 0 0 30px rgba(0, 0, 0, 0.4); }
            100% { border-color: rgba(80, 220, 80, 0.4); box-shadow: 0 0 60px rgba(40, 200, 40, 0.15); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #80d080, #40a040, #80d080);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 6s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(60, 180, 60, 0.1);
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            min-height: 4rem;
        }

        @keyframes shineText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .custom-widget {
            background: rgba(10, 20, 10, 0.6);
            border: 1px solid rgba(60, 180, 60, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 0 0 1.5rem 0;
            text-align: left;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .custom-widget:hover {
            border-color: rgba(80, 220, 80, 0.4);
            box-shadow: 0 0 50px rgba(40, 200, 40, 0.08);
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(60, 180, 60, 0.1);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }

        .widget-header .server-name {
            color: #80d080;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .widget-header .online-count {
            color: #60c060;
            font-size: 0.8rem;
            letter-spacing: 1px;
            background: rgba(60, 180, 60, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(60, 180, 60, 0.15);
        }

        .widget-channels {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .widget-channels span {
            color: #80a080;
            font-size: 0.65rem;
            letter-spacing: 1px;
            background: rgba(30, 50, 30, 0.3);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(60, 180, 60, 0.05);
        }

        .widget-channels span:before {
            content: "# ";
            color: #60a060;
        }

        .widget-members {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(60, 180, 60, 0.06);
        }

        .widget-members span {
            color: #90b090;
            font-size: 0.65rem;
            letter-spacing: 1px;
            background: rgba(20, 40, 20, 0.2);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .widget-members .member-online:before {
            content: "● ";
            color: #60c060;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .widget-members .member-idle:before {
            content: "● ";
            color: #c0a040;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .widget-members .member-offline:before {
            content: "○ ";
            color: #405040;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .server-name {
            font-size: 1.2rem;
            color: #80a080;
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(60, 180, 60, 0.05);
        }

        .server-name span {
            color: #60c060;
            text-shadow: 0 0 20px rgba(60, 180, 60, 0.15);
        }

        .btn-duel {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(60, 180, 60, 0.2);
            color: #80d080;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 40px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            margin-top: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(60, 180, 60, 0.05), 0 0 30px rgba(60, 180, 60, 0.02); }
            50% { box-shadow: 0 0 30px rgba(80, 220, 80, 0.15), 0 0 60px rgba(80, 220, 80, 0.08), 0 0 90px rgba(80, 220, 80, 0.04); }
            100% { box-shadow: 0 0 15px rgba(60, 180, 60, 0.05), 0 0 30px rgba(60, 180, 60, 0.02); }
        }

        .btn-duel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(60, 180, 60, 0.05), transparent, rgba(80, 220, 80, 0.05), transparent);
            animation: rotateBorder 8s linear infinite;
            opacity: 0.3;
        }

        @keyframes rotateBorder {
            100% { transform: rotate(360deg); }
        }

        .btn-duel:hover {
            background: rgba(60, 180, 60, 0.08);
            color: #a0e0a0;
            border-color: rgba(80, 220, 80, 0.3);
            box-shadow: 0 0 40px rgba(60, 180, 60, 0.08);
            transform: scale(1.02);
            animation-play-state: paused;
        }

        .btn-duel span {
            position: relative;
            z-index: 2;
        }

        .social-links {
            margin-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .social-link {
            color: #506050;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
            border: 1px solid rgba(60, 180, 60, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .social-link:hover {
            color: #80d080;
            border-color: rgba(80, 220, 80, 0.2);
            box-shadow: 0 0 30px rgba(60, 180, 60, 0.05);
            transform: scale(1.05);
        }

        .footer {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(60, 180, 60, 0.06);
            font-size: 0.7rem;
            color: #405040;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.8;
            min-height: 3rem;
        }

        .footer .highlight {
            color: #60a060;
            letter-spacing: 3px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; min-height: 3rem; }
            .custom-widget { padding: 1rem; }
            .widget-header .server-name { font-size: 0.8rem; }
            .widget-header .online-count { font-size: 0.65rem; }
            .server-name { font-size: 1rem; }
            .btn-duel { padding: 10px 20px; font-size: 0.9rem; }
            .social-link { font-size: 0.6rem; padding: 4px 10px; }
            .footer { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    <canvas id="rain-canvas"></canvas>
    <canvas id="particles-canvas"></canvas>

    <div class="content">

        <h1 id="titulo"></h1>

        <div class="custom-widget">
            <div class="widget-header">
                <span class="server-name">RATOS DE ESGOTO</span>
                <span class="online-count">10 MEMBROS ONLINE</span>
            </div>
            <div class="widget-channels">
                <span>bate-papo 1</span>
                <span>bate-papo 2</span>
                <span>bate-papo 3</span>
                <span>musica 1</span>
                <span>musica 2</span>
                <span>musica 3</span>
            </div>
            <div class="widget-members">
                <span class="member-online">Carl-bot</span>
                <span class="member-online">Jockie Music</span>
                <span class="member-online">Koya</span>
                <span class="member-idle">Rato anônimo</span>
                <span class="member-offline">Rato dorminhoco</span>
            </div>
        </div>

        <div class="server-name">
            <span>RATOS DE ESGOTO</span>
        </div>

        <a href="https://discord.gg/sHaECvHMXP" target="_self" class="btn-duel" id="btnDuel">
            <span>INVOCAR DISCORD</span>
        </a>

        <div class="social-links">
            <a href="https://www.youtube.com/channel/UCWD36eAq83hQOn5WQZSnrag" target="_blank" class="social-link">YOUTUBE</a>
        </div>

        <div class="footer">
            <span class="highlight" id="rodape"></span>
        </div>

    </div>

    <script>
        const titulo = document.getElementById('titulo');
        const texto = 'RATOS DE ESGOTO';
        let index = 0;

        function digitarTitulo() {
            if (index < texto.length) {
                titulo.textContent += texto.charAt(index);
                index++;
                setTimeout(digitarTitulo, 80);
            }
        }
        digitarTitulo();

        const rodape = document.getElementById('rodape');
        const textoRodape = 'Jerry roubou meu queijo...';
        let indexRodape = 0;

        function digitarRodape() {
            if (indexRodape < textoRodape.length) {
                rodape.textContent += textoRodape.charAt(indexRodape);
                indexRodape++;
                setTimeout(digitarRodape, 60);
            }
        }

        const canvasRain = document.getElementById('rain-canvas');
        const ctxRain = canvasRain.getContext('2d');
        let rainWidth, rainHeight;
        let drops = [];

        function resizeRain() {
            rainWidth = canvasRain.width = window.innerWidth;
            rainHeight = canvasRain.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeRain);
        resizeRain();

        const chars = ['#', '~', '.', '`', "'", '=', '-'];

        class RainDrop {
            constructor() {
                this.x = Math.random() * rainWidth;
                this.y = Math.random() * rainHeight - rainHeight;
                this.char = chars[Math.floor(Math.random() * chars.length)];
                this.size = Math.floor(Math.random() * 12) + 8;
                this.speed = Math.random() * 2 + 1.5;
                this.opacity = Math.random() * 0.4 + 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > rainHeight) {
                    this.y = -this.size;
                    this.x = Math.random() * rainWidth;
                    this.char = chars[Math.floor(Math.random() * chars.length)];
                    this.speed = Math.random() * 2 + 1.5;
                    this.opacity = Math.random() * 0.4 + 0.2;
                }
            }

            draw() {
                ctxRain.fillStyle = `rgba(100, 200, 100, ${this.opacity})`;
                ctxRain.font = `${this.size}px monospace`;
                ctxRain.fillText(this.char, this.x, this.y);
            }
        }

        function initRain(count = 120) {
            drops = [];
            for (let i = 0; i < count; i++) {
                drops.push(new RainDrop());
            }
        }
        initRain(140);

        function animateRain() {
            ctxRain.clearRect(0, 0, rainWidth, rainHeight);
            drops.forEach(d => {
                d.update();
                d.draw();
            });
            requestAnimationFrame(animateRain);
        }
        animateRain();

        const canvasParticles = document.getElementById('particles-canvas');
        const ctxParticles = canvasParticles.getContext('2d');
        let pWidth, pHeight;
        let particles = [];

        function resizeParticles() {
            pWidth = canvasParticles.width = window.innerWidth;
            pHeight = canvasParticles.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeParticles);
        resizeParticles();

        const colors = ['#2a5a2a', '#3a6a3a', '#1a4a1a', '#4a7a4a', '#2a5a2a', '#3a7a3a', '#1a3a1a', '#4a6a4a'];

        class Particle {
            constructor() {
                this.x = Math.random() * pWidth;
                this.y = Math.random() * pHeight;
                this.size = Math.floor(Math.random() * 6) + 3;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.4 + 0.1;
                this.trail = [];
                this.maxTrail = 3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > pWidth || this.x < 0) this.speedX *= -1;
                if (this.y > pHeight || this.y < 0) this.speedY *= -1;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) this.trail.shift();
            }

            draw() {
                for (let i = 0; i < this.trail.length; i++) {
                    const pos = this.trail[i];
                    const opacity = (i / this.trail.length) * this.opacity * 0.3;
                    ctxParticles.fillStyle = this.color;
                    ctxParticles.globalAlpha = opacity;
                    ctxParticles.fillRect(pos.x - this.size / 2, pos.y - this.size / 2, this.size, this.size);
                }
                ctxParticles.globalAlpha = this.opacity;
                ctxParticles.fillStyle = this.color;
                ctxParticles.shadowColor = this.color;
                ctxParticles.shadowBlur = 8;
                ctxParticles.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                ctxParticles.shadowBlur = 0;
                ctxParticles.globalAlpha = 1;
            }
        }

        function initParticles(count = 200) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles(200);

        function animateParticles() {
            ctxParticles.clearRect(0, 0, pWidth, pHeight);
            ctxParticles.fillStyle = 'rgba(10, 18, 10, 0.15)';
            ctxParticles.fillRect(0, 0, pWidth, pHeight);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        const btn = document.getElementById('btnDuel');
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const discordLink = this.href;
            this.style.transform = 'scale(0.95)';
            setTimeout(() => this.style.transform = 'scale(1)', 150);
            setTimeout(() => {
                window.location.href = discordLink;
            }, 250);
        });

        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-duel')) return;
            for (let i = 0; i < 12; i++) {
                const p = new Particle();
                p.x = e.clientX + (Math.random() - 0.5) * 80;
                p.y = e.clientY + (Math.random() - 0.5) * 80;
                p.size = Math.floor(Math.random() * 8) + 2;
                p.speedX = (Math.random() - 0.5) * 2;
                p.speedY = (Math.random() - 0.5) * 2;
                p.color = colors[Math.floor(Math.random() * colors.length)];
                p.opacity = Math.random() * 0.5 + 0.2;
                particles.push(p);
                setTimeout(() => {
                    const index = particles.indexOf(p);
                    if (index > -1) particles.splice(index, 1);
                }, 2000);
            }
        });

        setTimeout(digitarRodape, 1200);
    </script>

</body>
</html>
